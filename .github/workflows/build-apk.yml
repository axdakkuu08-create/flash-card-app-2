name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Inspect and extract project archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          ARCHIVE=""
          for candidate in js-flashcards-offline-admin-12.zip js-flashcards-fixed.zip js-flashcards.zip; do
            if [ -f "$candidate" ]; then ARCHIVE="$candidate"; break; fi
          done
          if [ -z "$ARCHIVE" ]; then
            echo "::error::No supported project ZIP found in repository root."
            exit 1
          fi
          echo "Selected archive: $ARCHIVE"
          unzip -t "$ARCHIVE"
          unzip -q "$ARCHIVE" -d extracted
          find extracted -type f -printf '%P\n' | sort | head -150

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/extracted"
          OUT="$GITHUB_WORKSPACE/apk-output"
          mkdir -p "$OUT"

          # Prefer the supplied native Android project, even when it has no gradlew.
          APP_GRADLE="$(find "$ROOT" -type f -path '*/android/app/build.gradle' -print -quit || true)"
          if [ -n "$APP_GRADLE" ] && [ -f "$(dirname "$(dirname "$APP_GRADLE")")/build.gradle" ]; then
            APP_DIR="$(dirname "$APP_GRADLE")"
            ANDROID_DIR="$(dirname "$APP_DIR")"
            PROJECT_DIR="$(dirname "$ANDROID_DIR")"
            WEB_DIR="$PROJECT_DIR/web"

            echo "Using native Android project: $ANDROID_DIR"
            test -f "$WEB_DIR/index.html"

            # Bundle React locally so app startup never waits for a CDN/network request.
            VENDOR_DIR="$WEB_DIR/vendor"
            mkdir -p "$VENDOR_DIR"
            curl --fail --location --silent --show-error --retry 3 \
              https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js \
              -o "$VENDOR_DIR/react.production.min.js"
            curl --fail --location --silent --show-error --retry 3 \
              https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js \
              -o "$VENDOR_DIR/react-dom.production.min.js"

            # Android WebView can block file:// JavaScript loading sibling file:// scripts.
            # Inline both local React bundles into index.html so the flashcards render offline.
            python3 - "$WEB_DIR/index.html" "$VENDOR_DIR/react.production.min.js" "$VENDOR_DIR/react-dom.production.min.js" <<'PY'
            import pathlib, sys
            html_path, react_path, dom_path = map(pathlib.Path, sys.argv[1:])
            html = html_path.read_text(encoding="utf-8")
            replacements = [
                ('<script src="vendor/react.production.min.js"></script>', react_path.read_text(encoding="utf-8")),
                ('<script src="vendor/react-dom.production.min.js"></script>', dom_path.read_text(encoding="utf-8")),
            ]
            for tag, script in replacements:
                if html.count(tag) != 1:
                    raise SystemExit(f"Expected exactly one {tag!r} in index.html")
                html = html.replace(tag, "<script>\\n" + script + "\\n</script>", 1)
            html_path.write_text(html, encoding="utf-8")
            assert "src=\\"vendor/react.production.min.js\\"" not in html
            assert "src=\\"vendor/react-dom.production.min.js\\"" not in html
            print("Inlined React and ReactDOM into index.html for offline WebView startup.")
            PY
            test -s "$VENDOR_DIR/react.production.min.js"
            test -s "$VENDOR_DIR/react-dom.production.min.js"

            # Android WebView can block file:// JavaScript loading sibling file:// scripts.
            # Inline both local React bundles into index.html so the flashcards render offline.
            python3 - "$WEB_DIR/index.html" "$VENDOR_DIR/react.production.min.js" "$VENDOR_DIR/react-dom.production.min.js" <<'PY'
            import pathlib, sys
            html_path, react_path, dom_path = map(pathlib.Path, sys.argv[1:])
            html = html_path.read_text(encoding="utf-8")
            replacements = [
                ('<script src="vendor/react.production.min.js"></script>', react_path.read_text(encoding="utf-8")),
                ('<script src="vendor/react-dom.production.min.js"></script>', dom_path.read_text(encoding="utf-8")),
            ]
            for tag, script in replacements:
                if html.count(tag) != 1:
                    raise SystemExit(f"Expected exactly one {tag!r} in index.html")
                html = html.replace(tag, "<script>\\n" + script + "\\n</script>", 1)
            html_path.write_text(html, encoding="utf-8")
            assert "src=\\"vendor/react.production.min.js\\"" not in html
            assert "src=\\"vendor/react-dom.production.min.js\\"" not in html
            print("Inlined React and ReactDOM into index.html for offline WebView startup.")
            PY

            gradle -p "$ANDROID_DIR" clean assembleDebug --no-daemon
            APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"
          else
            # Fallback for web-only archives without a native Android project.
            WEB_INDEX="$(find "$ROOT" -type f -path '*/web/index.html' -not -path '*/node_modules/*' -print -quit || true)"
            if [ -z "$WEB_INDEX" ]; then
              WEB_INDEX="$(find "$ROOT" -type f -name index.html -not -path '*/node_modules/*' -print -quit || true)"
            fi
            if [ -z "$WEB_INDEX" ]; then
              echo "::error::No usable index.html found in the selected ZIP."
              exit 1
            fi

            WEB_DIR="$(dirname "$WEB_INDEX")"
            VENDOR_DIR="$WEB_DIR/vendor"
            mkdir -p "$VENDOR_DIR"
            curl --fail --location --silent --show-error --retry 3 \
              https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js \
              -o "$VENDOR_DIR/react.production.min.js"
            curl --fail --location --silent --show-error --retry 3 \
              https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js \
              -o "$VENDOR_DIR/react-dom.production.min.js"

            WRAPPER="$RUNNER_TEMP/flashcards-capacitor"
            mkdir -p "$WRAPPER/www"
            cp -a "$WEB_DIR"/. "$WRAPPER/www"/
            cd "$WRAPPER"
            npm init -y
            npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
            npx cap init Flashcards com.axdak.flashcards --web-dir=www
            npx cap add android
            npx cap sync android
            cd android
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
            APK="$WRAPPER/android/app/build/outputs/apk/debug/app-debug.apk"
          fi

          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          cp "$APK" "$OUT/Flashcards-debug.apk"
          ls -lh "$OUT/Flashcards-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flashcards-Android-APK
          path: apk-output/Flashcards-debug.apk
          if-no-files-found: error
          retention-days: 14
