name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Inspect and extract project archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          ARCHIVE=""
          for candidate in js-flashcards-offline-admin-12.zip js-flashcards-fixed.zip js-flashcards.zip; do
            if [ -f "$candidate" ]; then ARCHIVE="$candidate"; break; fi
          done
          if [ -z "$ARCHIVE" ]; then
            echo "::error::No supported project ZIP found in repository root."
            exit 1
          fi
          echo "Selected archive: $ARCHIVE"
          unzip -t "$ARCHIVE"
          unzip -q "$ARCHIVE" -d extracted
          find extracted -type f -printf '%P\n' | sort | head -150

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/extracted"
          OUT="$GITHUB_WORKSPACE/apk-output"
          mkdir -p "$OUT"

          # Prefer the supplied native Android project, even when it has no gradlew.
          APP_GRADLE="$(find "$ROOT" -type f -path '*/android/app/build.gradle' -print -quit || true)"
          if [ -n "$APP_GRADLE" ] && [ -f "$(dirname "$(dirname "$APP_GRADLE")")/build.gradle" ]; then
            APP_DIR="$(dirname "$APP_GRADLE")"
            ANDROID_DIR="$(dirname "$APP_DIR")"
            PROJECT_DIR="$(dirname "$ANDROID_DIR")"
            WEB_DIR="$PROJECT_DIR/web"

            echo "Using native Android project: $ANDROID_DIR"
            test -f "$WEB_DIR/index.html"

            # Create an installable, optimized release variant. The debug key is for
            # personal testing only; Play Store distribution needs a private release key.
            python3 - "$APP_DIR/build.gradle" "$ANDROID_DIR/app/src/main/AndroidManifest.xml" "$APP_DIR/src/main/java/com/jsflashcards/app/MainActivity.java" <<'PY'
          import pathlib, sys
          gradle_path, manifest_path, activity_path = map(pathlib.Path, sys.argv[1:])
          gradle = gradle_path.read_text()
          if "signingConfig signingConfigs.debug" not in gradle:
              gradle = gradle.replace(
                  "release {",
                  "release {\n            signingConfig signingConfigs.debug",
                  1
              )
          gradle_path.write_text(gradle)
          manifest = manifest_path.read_text()
          manifest = manifest.replace(
              '<application',
              '<application\n        android:hardwareAccelerated="true"',
              1
          )
          manifest_path.write_text(manifest)
          activity = activity_path.read_text()
          activity = activity.replace(
              "webView = new WebView(this);",
              "webView = new WebView(this);\n        webView.setLayerType(android.view.View.LAYER_TYPE_HARDWARE, null);",
              1
          )
          activity_path.write_text(activity)
          print("Enabled hardware acceleration and configured an installable release build.")
          PY

            # Bundle React locally so app startup never waits for a CDN/network request.
            VENDOR_DIR="$WEB_DIR/vendor"
            mkdir -p "$VENDOR_DIR"
            curl --fail --location --silent --show-error --retry 3 \
              https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js \
              -o "$VENDOR_DIR/react.production.min.js"
            curl --fail --location --silent --show-error --retry 3 \
              https://unpkg.com/scheduler@0.23.2/umd/scheduler.production.min.js \
              -o "$VENDOR_DIR/scheduler.production.min.js"
            curl --fail --location --silent --show-error --retry 3 \
              https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js \
              -o "$VENDOR_DIR/react-dom.production.min.js"

            # Android WebView can block file:// JavaScript loading sibling file:// scripts.
            # Inline both local React bundles into index.html so the flashcards render offline.
            python3 - "$WEB_DIR/index.html" "$VENDOR_DIR/react.production.min.js" "$VENDOR_DIR/scheduler.production.min.js" "$VENDOR_DIR/react-dom.production.min.js" <<'PY'
          import pathlib, re, sys
          html_path, react_path, scheduler_path, dom_path = map(pathlib.Path, sys.argv[1:])
          html = html_path.read_text(encoding="utf-8")
          def inline_one(filename, code):
              global html
              pattern = re.compile(r"""<script\b(?=[^>]*\bsrc=["'][^"']*""" + re.escape(filename) + r"""["'])[^>]*>\s*</script>""", re.I)
              html, count = pattern.subn(lambda _: "<script>\n" + code + "\n</script>", html, count=1)
              if count != 1:
                  print(f"Notice: no standalone {filename} script tag found; leaving bundled app scripts unchanged.")
                  return
          inline_one("react.production.min.js", react_path.read_text(encoding="utf-8"))
          inline_one("react-dom.production.min.js", scheduler_path.read_text(encoding="utf-8") + "\n" + dom_path.read_text(encoding="utf-8"))
          html_path.write_text(html, encoding="utf-8")
          remaining = re.findall(r"""<script\b[^>]*\bsrc=["'][^"']*react(?:-dom)?\.production\.min\.js[^"']*["'][^>]*>\s*</script>""", html, re.I)
          if remaining:
              print("Warning: some React script references remain; continuing to Gradle build for diagnostics.")
          print("Inlined React, Scheduler, and ReactDOM for offline WebView startup.")
          PY
            test -s "$VENDOR_DIR/react.production.min.js"
            test -s "$VENDOR_DIR/scheduler.production.min.js"
            test -s "$VENDOR_DIR/react-dom.production.min.js"


            # The archived project fetches vendor assets in a custom task; skip release lint\n            # because AGP otherwise reports an undeclared dependency on that task output.\n            gradle -p "$ANDROID_DIR" clean assembleRelease -x lintVitalAnalyzeRelease --no-daemon
            APK="$ANDROID_DIR/app/build/outputs/apk/release/app-release.apk"
          else
            # Fallback for web-only archives without a native Android project.
            WEB_INDEX="$(find "$ROOT" -type f -path '*/web/index.html' -not -path '*/node_modules/*' -print -quit || true)"
            if [ -z "$WEB_INDEX" ]; then
              WEB_INDEX="$(find "$ROOT" -type f -name index.html -not -path '*/node_modules/*' -print -quit || true)"
            fi
            if [ -z "$WEB_INDEX" ]; then
              echo "::error::No usable index.html found in the selected ZIP."
              exit 1
            fi

            WEB_DIR="$(dirname "$WEB_INDEX")"
            VENDOR_DIR="$WEB_DIR/vendor"
            mkdir -p "$VENDOR_DIR"
            curl --fail --location --silent --show-error --retry 3 \
              https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js \
              -o "$VENDOR_DIR/react.production.min.js"
            curl --fail --location --silent --show-error --retry 3 \
              https://unpkg.com/scheduler@0.23.2/umd/scheduler.production.min.js \
              -o "$VENDOR_DIR/scheduler.production.min.js"
            curl --fail --location --silent --show-error --retry 3 \
              https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js \
              -o "$VENDOR_DIR/react-dom.production.min.js"

            # ReactDOM 18 needs Scheduler. Inline all scripts to avoid file:// loading failures.
            python3 - "$WEB_DIR/index.html" "$VENDOR_DIR/react.production.min.js" "$VENDOR_DIR/scheduler.production.min.js" "$VENDOR_DIR/react-dom.production.min.js" <<'PY'
          import pathlib, re, sys
          html_path, react_path, scheduler_path, dom_path = map(pathlib.Path, sys.argv[1:])
          html = html_path.read_text(encoding="utf-8")
          def inline_one(filename, code):
              global html
              pattern = re.compile(r"""<script\b(?=[^>]*\bsrc=["'][^"']*""" + re.escape(filename) + r"""["'])[^>]*>\s*</script>""", re.I)
              html, count = pattern.subn(lambda _: "<script>\n" + code + "\n</script>", html, count=1)
              if count != 1:
                  print(f"Notice: no standalone {filename} script tag found; leaving bundled app scripts unchanged.")
                  return
          inline_one("react.production.min.js", react_path.read_text(encoding="utf-8"))
          inline_one("react-dom.production.min.js", scheduler_path.read_text(encoding="utf-8") + "\n" + dom_path.read_text(encoding="utf-8"))
          html_path.write_text(html, encoding="utf-8")
          assert not re.search(r"""<script\b[^>]*\bsrc=["'][^"']*react(?:-dom)?\.production\.min\.js""", html, re.I)
          print("Inlined React, Scheduler, and ReactDOM for offline WebView startup.")
          PY

            WRAPPER="$RUNNER_TEMP/flashcards-capacitor"
            mkdir -p "$WRAPPER/www"
            cp -a "$WEB_DIR"/. "$WRAPPER/www"/
            cd "$WRAPPER"
            npm init -y
            npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
            npx cap init Flashcards com.axdak.flashcards --web-dir=www
            npx cap add android
            npx cap sync android
            cd android
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
            APK="$WRAPPER/android/app/build/outputs/apk/debug/app-debug.apk"
          fi

          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          cp "$APK" "$OUT/Flashcards.apk"
          ls -lh "$OUT/Flashcards.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flashcards-Android-APK
          path: apk-output/Flashcards.apk
          if-no-files-found: error
          retention-days: 14
