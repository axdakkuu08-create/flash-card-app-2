name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Inspect and extract project archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          ARCHIVE=""
          for candidate in js-flashcards-offline-admin-12.zip js-flashcards-fixed.zip js-flashcards.zip; do
            if [ -f "$candidate" ]; then ARCHIVE="$candidate"; break; fi
          done
          if [ -z "$ARCHIVE" ]; then
            echo "::error::No supported project ZIP found in repository root."
            exit 1
          fi
          echo "Selected archive: $ARCHIVE"
          unzip -t "$ARCHIVE"
          unzip -q "$ARCHIVE" -d extracted
          find extracted -type f -printf '%P\n' | sort | head -150

      - name: Build offline Android APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/extracted"
          OUT="$GITHUB_WORKSPACE/apk-output"
          mkdir -p "$OUT"

          APP_GRADLE="$(find "$ROOT" -type f -path '*/android/app/build.gradle' -print -quit || true)"
          if [ -n "$APP_GRADLE" ]; then
            APP_DIR="$(dirname "$APP_GRADLE")"
            ANDROID_DIR="$(dirname "$APP_DIR")"
            PROJECT_DIR="$(dirname "$ANDROID_DIR")"
            WEB_DIR="$PROJECT_DIR/web"
            test -s "$WEB_DIR/index.html" || { echo "::error::Missing web/index.html at $WEB_DIR"; exit 1; }
            test -s "$ANDROID_DIR/build.gradle" || { echo "::error::Missing Android root build.gradle"; exit 1; }

            echo "Native Android project: $ANDROID_DIR"
            echo "Web app: $WEB_DIR"

            # Obtain known-good React UMD files from npm and inline them into the
            # packaged HTML so WebView never depends on network access at runtime.
            VENDOR_ROOT="$RUNNER_TEMP/react-vendor"
            mkdir -p "$VENDOR_ROOT"
            npm install --prefix "$VENDOR_ROOT" --no-save --no-audit --no-fund react@18.3.1 react-dom@18.3.1 scheduler@0.23.2
            REACT="$VENDOR_ROOT/node_modules/react/umd/react.production.min.js"
            SCHEDULER="$VENDOR_ROOT/node_modules/scheduler/umd/scheduler.production.min.js"
            REACTDOM="$VENDOR_ROOT/node_modules/react-dom/umd/react-dom.production.min.js"
            for f in "$REACT" "$SCHEDULER" "$REACTDOM"; do
              test -s "$f" || { echo "::error::Required offline JavaScript bundle is missing or empty: $f"; exit 1; }
            done

            python3 - "$WEB_DIR/index.html" "$REACT" "$SCHEDULER" "$REACTDOM" <<'PY'
          import pathlib, re, sys
          html_path, react_path, scheduler_path, dom_path = map(pathlib.Path, sys.argv[1:])
          html = html_path.read_text(encoding="utf-8")
          react = react_path.read_text(encoding="utf-8")
          scheduler = scheduler_path.read_text(encoding="utf-8")
          dom = dom_path.read_text(encoding="utf-8")

          def inline_src(filename, code):
              global html
              pattern = re.compile(
                  r'<script\b(?=[^>]*\bsrc=["\'][^"\']*/?' + re.escape(filename) +
                  r'["\'])[^>]*>\s*</script>',
                  re.I
              )
              html, count = pattern.subn(lambda _: '<script>\n' + code + '\n</script>', html, count=1)
              return count

          # ReactDOM 18 expects the Scheduler global. Inline Scheduler immediately
          # before ReactDOM, even if the archive originally had a separate script.
          react_count = inline_src("react.production.min.js", react)
          dom_count = inline_src("react-dom.production.min.js", scheduler + "\n" + dom)
          # Remove a standalone Scheduler script if present; it is already bundled above.
          html = re.sub(
              r'<script\b(?=[^>]*\bsrc=["\'][^"\']*/?scheduler\.production\.min\.js["\'])[^>]*>\s*</script>',
              '',
              html,
              flags=re.I
          )
          if re.search(r'<script\b[^>]*\bsrc=["\'][^"\']*(?:react|react-dom|scheduler)\.production\.min\.js', html, re.I):
              raise SystemExit("A React/Scheduler CDN or file script reference remains in index.html.")
          print(f"Offline bundles prepared (React tag replacements: {react_count}; ReactDOM tag replacements: {dom_count}).")
          html_path.write_text(html, encoding="utf-8")
          PY

            # Enable hardware acceleration without duplicating the manifest attribute.
            python3 - "$ANDROID_DIR/app/src/main/AndroidManifest.xml" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          m = re.search(r'<application\b[^>]*>', s, re.S)
          if not m:
              raise SystemExit("AndroidManifest.xml has no application element.")
          tag = m.group(0)
          if 'android:hardwareAccelerated=' not in tag:
              s = s[:m.start()] + tag[:-1] + '\n        android:hardwareAccelerated="true">' + s[m.end():]
          p.write_text(s, encoding="utf-8")
          PY

            # A debug APK is automatically signed for direct personal installation.
            gradle -p "$ANDROID_DIR" clean assembleDebug --no-daemon --stacktrace
            APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"
          else
            WEB_INDEX="$(find "$ROOT" -type f -name index.html -not -path '*/node_modules/*' -print -quit || true)"
            if [ -z "$WEB_INDEX" ]; then
              echo "::error::No Android project or usable index.html found in the selected ZIP."
              exit 1
            fi
            WEB_DIR="$(dirname "$WEB_INDEX")"
            WRAPPER="$RUNNER_TEMP/flashcards-capacitor"
            mkdir -p "$WRAPPER/www"
            cp -a "$WEB_DIR"/. "$WRAPPER/www"/
            cd "$WRAPPER"
            npm init -y
            npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
            npx cap init Flashcards com.axdak.flashcards --web-dir=www
            npx cap add android
            npx cap sync android
            cd android
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
            APK="$WRAPPER/android/app/build/outputs/apk/debug/app-debug.apk"
          fi

          test -s "$APK" || { echo "::error::Gradle did not produce the expected APK: $APK"; exit 1; }
          unzip -tq "$APK" >/dev/null
          cp "$APK" "$OUT/Flashcards.apk"
          ls -lh "$OUT/Flashcards.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flashcards-Android-APK
          path: apk-output/Flashcards.apk
          if-no-files-found: error
          retention-days: 14
