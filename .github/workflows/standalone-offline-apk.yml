name: Standalone Offline Android APK

on:
  push:
    branches:
      - feat/standalone-offline-app
    paths:
      - 'offline-app/**'
      - '.github/workflows/standalone-offline-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'offline-app/**'
      - '.github/workflows/standalone-offline-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Offline logic and security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline app tests
        working-directory: offline-app
        run: node --test tests/*.test.cjs

  build:
    name: Build and verify debug APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build debug APK
        run: gradle -p offline-app/android clean assembleDebug --no-daemon
      - name: Verify APK signature and archive
        run: |
          set -euo pipefail
          APK=offline-app/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -tq "$APK" >/dev/null
          sha256sum "$APK"
          mkdir -p dist
          cp "$APK" dist/flashcards-offline.apk
      - uses: actions/upload-artifact@v4
        with:
          name: flashcards-offline-apk
          path: dist/flashcards-offline.apk
          if-no-files-found: error
          retention-days: 14
