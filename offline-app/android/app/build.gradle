plugins {
    id 'com.android.application'
}

android {
    namespace 'app.flashcards.offline'
    compileSdk 35

    defaultConfig {
        applicationId 'app.flashcards.offline'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}

// The web app lives in ../www and is bundled into the APK assets at build time.
tasks.register('copyWww', Copy) {
    from "${rootDir}/../www"
    into "${projectDir}/src/main/assets/www"
}

tasks.named('preBuild') {
    dependsOn 'copyWww'
}
