<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="theme-color" content="#0b1120">
  <title>Flashcards Offline</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="dot" aria-hidden="true"></span>
        <h1 id="title">Dashboard</h1>
      </div>
      <span class="pill">Works offline</span>
    </header>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <main id="view" class="view" tabindex="-1"></main>

    <input id="import-file" type="file" accept="application/json,.json" hidden>

    <dialog id="confirm" class="confirm" aria-labelledby="confirm-text">
      <form method="dialog" class="confirm-form">
        <p id="confirm-text"></p>
        <div class="row2">
          <button value="cancel" class="btn secondary" type="submit">Cancel</button>
          <button id="confirm-ok" value="ok" class="btn danger" type="submit">Confirm</button>
        </div>
      </form>
    </dialog>

    <nav class="dock" aria-label="Primary">
      <button class="dock-btn active" data-route="home" type="button" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </button>
      <button class="dock-btn" data-route="study" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        <span>Study</span>
      </button>
      <button class="dock-btn fab" data-route="create" type="button" aria-label="New card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="dock-btn" data-route="decks" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        <span>Decks</span>
      </button>
      <button class="dock-btn" data-route="stats" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>Progress</span>
      </button>
    </nav>
  </div>

  <script src="js/model.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
